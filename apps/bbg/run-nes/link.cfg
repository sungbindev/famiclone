# 名称：link.cfg
# 说明：在步步高 BBGDOS 下运行 NES 游戏的 CMD 程序的链接配置：与 bbg 目标的配置相同（文件前 2 个字节是装入地址，
#       程序放在 $8000-$BFFF，BSS 紧接在后面不写进文件），另加两段运行在公共 RAM 里的代码：
#       TRAMP 运行在内部 RAM $0300，负责切换页并进入游戏；STUBS 运行在 $7E00，是游戏运行期间要用的小桩。
#       两段都存在程序文件里，由 _main 在最后一步复制到运行地址。
MEMORY {
    ZP:         file = "", start = $0020, size = $0060;
    HEADER:     file = %O, start = $0000, size = $0002;
    PROGRAM:    file = %O, start = $8000, size = $4000, define = yes;
    TRAMPMEM:   file = "", start = $0300, size = $0100;
    STUBMEM:    file = "", start = $7E00, size = $0100;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp,  optional = yes;
    LOADADDR:  load = HEADER,   type = ro;
    STARTUP:   load = PROGRAM,  type = ro;
    CODE:      load = PROGRAM,  type = ro;
    RODATA:    load = PROGRAM,  type = ro,  optional = yes;
    DATA:      load = PROGRAM,  type = rw,  optional = yes;
    TRAMP:     load = PROGRAM,  run = TRAMPMEM, type = ro, define = yes;
    STUBS:     load = PROGRAM,  run = STUBMEM,  type = ro, define = yes;
    BSS:       load = PROGRAM,  type = bss, optional = yes;
}
