# 名称：link.cfg
# 说明：FBASIC 的链接配置。文件按区域排列：常驻程序 0-1 页，整机映像 2-9 页（$8000-$FFFF，窗口 0-7），CHR 10-11 页，GAME 数据 12-14 页。
# 作者：sungbin
# 邮箱：sungbin@3578.cn
# 日期：2026-11-23
# 备注：启动代码 crt0 与库仍按目标链接，这里的内存区与段以目标自带的 link.cfg 为底稿修改。ERAM 小段（STUB）常驻在程序页里，运行地址在 ERAM $7E00。

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0400;    # C 软件栈 1K，在程序窗口的顶端
    __STACKSTART__: type = weak, value = $C000;    # 栈从 $C000 向下增长
    __ZPSTART__:    type = weak, value = $0060;    # C 运行库的零页
}
MEMORY {
    ZP:      file = "",  define = yes, start = __ZPSTART__, size = $0020;
    MAIN:    file = %O,  start = $8000, size = $2000, fill = yes, fillval = $00;
    IMAGE:   file = %O,  start = $8000, size = $7FFA, fill = yes, fillval = $00;
    VECTORS: file = %O,  start = $FFFA, size = $0006;
    CHR:     file = %O,  start = $0000, size = $2000, fill = yes, fillval = $00;
    GAME:    file = %O,  start = $0000, size = $3000, fill = yes, fillval = $00;
    STUBRAM:             start = $7E00, size = $01A0;
}
SEGMENTS {
    HEADER:   load = MAIN, type = ro;
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro;
    LOWCODE:  load = MAIN, type = ro,  optional = yes;
    ONCE:     load = MAIN, type = ro,  optional = yes;
    CODE:     load = MAIN, type = rw;
    RODATA:   load = MAIN, type = rw;
    DATA:     load = MAIN, type = rw;
    STUB:     load = MAIN, run = STUBRAM, type = ro, define = yes;
    BSS:      load = MAIN, type = bss, define = yes;
    IMAGE:    load = IMAGE,   type = ro;
    VECTORS:  load = VECTORS, type = ro;
    CHR:      load = CHR,     type = ro;
    GAME:     load = GAME,    type = ro;
}
