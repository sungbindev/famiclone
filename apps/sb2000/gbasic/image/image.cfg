# ------------------------------------------------------------------------
# 名称：image.cfg
# 说明：GBASIC 映像的 ld65 链接配置：32K，窗口 0-7（$8000-$FFFF）整段运行；前 $200 字节是 ERAM 小段（stub）的装载区，加载器把它复制到 ERAM $7E00 运行。
# 作者：sungbin
# 邮箱：sungbin@3578.cn
# 日期：2026-11-16
# 备注：布局（文件里的顺序必须与地址顺序一致）：
#       $8000-$81FF  STUBLOAD  ERAM 小段的装载区（运行地址 STUBRUN）
#       $8200-$F6FF  IMAGE     代码、表格与图案数据（图案数据之后的 RAM 是 BASIC 程序文本区）
#       $F700-$FEFF  BUFFER    DOS 现场交换缓冲，2K
#       $FF00-$FFF9  TAIL      保留
#       $FFFA-$FFFF  VECTORS   NMI、复位、IRQ 向量
# ------------------------------------------------------------------------
MEMORY {
    STUBLOAD: file = %O, start = $8000, size = $0200, fill = yes, fillval = $FF;
    IMAGE:    file = %O, start = $8200, size = $7500, fill = yes, fillval = $00;
    BUFFER:   file = %O, start = $F700, size = $0800, fill = yes, fillval = $00;
    TAIL:     file = %O, start = $FF00, size = $00FA, fill = yes, fillval = $00;
    VECTORS:  file = %O, start = $FFFA, size = $0006;
    STUBRUN:  file = "", start = $7E00, size = $01C0;
    STUBVAR:  file = "", start = $7FC0, size = $0040;
}
SEGMENTS {
    STUB:     load = STUBLOAD, run = STUBRUN, type = ro, define = yes;
    STUBVAR:  load = STUBVAR,  type = bss;
    CODE:     load = IMAGE,    type = ro;
    RODATA:   load = IMAGE,    type = ro,  optional = yes;
    BUFFER:   load = BUFFER,   type = ro;
    TAIL:     load = TAIL,     type = ro;
    VECTORS:  load = VECTORS,  type = ro;
}
