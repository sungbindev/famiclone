MEMORY {
    PRG:    start = $8000, size = $8000, fill = yes, fillval = $FF, file = %O;
    RAMRUN: start = $0200, size = $00F0, file = "";
}
SEGMENTS {
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    RAMCODE:  load = PRG, run = RAMRUN, type = ro, define = yes;
    VECTORS:  load = PRG, type = ro, start = $FFF8;
}
