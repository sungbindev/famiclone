# 名称：sb97-exe.cfg
# 说明：SB97 DOS 程序的链接配置：32K 映像（$8000-$FFFF），装载程序存在映像里、运行在工作 RAM $6000，缓冲放在工作 RAM 的 $6C00 与 $6E00。
MEMORY {
    BANK0:      start = $8000, size = $8000, fill = yes, fillval = $FF, file = %O;
    WRAM:       start = $6000, size = $0C00, type = rw;
    SECTBUF_M:  start = $6C00, size = $0200, type = rw;
    FATBUF_M:   start = $6E00, size = $0200, type = rw;
}

SEGMENTS {
    STUB:      load = BANK0, type = ro;
    LOADER:    load = BANK0, run = WRAM, type = ro, define = yes;
    VECTORS:   load = BANK0, type = ro, start = $FFF8;
    SECTBUF:   load = SECTBUF_M, type = bss;
    FATBUF:    load = FATBUF_M, type = bss;
}
