<!doctype html>
<!--
========================================================================
名称：index.html
说明：界面入口页：外壳与页面都由 React 渲染到 #root，并设置界面的内容安全策略。
作者：sungbin
邮箱：sungbin@3578.cn
日期：2026-11-13
备注：只允许同源脚本与样式，不允许内联脚本与 eval；渲染 Worker（画面的 WebGL 渲染）只允许同源的脚本（worker-src 'self'，不允许 blob: 与 data:），不放宽 script-src；不加载任何外部资源，媒体与外部连接一律禁止；
     开发模式需要的热更新连接由 vite.renderer.config.mts 在开发时追加。
========================================================================
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ember</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap/renderer/renderer.tsx"></script>
  </body>
</html>
