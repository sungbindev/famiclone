# 链接配置：由 FC Dev 的反汇编工程按布局生成，不要手改。
# 各段按映像文件偏移顺序首尾相接，写到同一个输出文件，产物就是映像本身。
MEMORY {
  # 段 0：映像文件偏移 $0 起，14822 字节
  SEG0: file = %O, start = $7C00, size = $39E6, fill = yes;
}
SEGMENTS {
  SEG0_0000: load = SEG0, type = ro;
  SEG0_0400: load = SEG0, type = ro;
  SEG0_049E: load = SEG0, type = ro;
  SEG0_07A8: load = SEG0, type = ro;
  SEG0_0E15: load = SEG0, type = ro;
  SEG0_1C00: load = SEG0, type = ro;
  SEG0_2177: load = SEG0, type = ro;
  SEG0_29BC: load = SEG0, type = ro;
  SEG0_2EA9: load = SEG0, type = ro;
  SEG0_3574: load = SEG0, type = ro;
  SEG0_37B6: load = SEG0, type = ro;
}
