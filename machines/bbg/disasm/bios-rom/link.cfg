# 链接配置：由 fcdev 的反汇编工程按布局生成，不要手改。
# 各段按映像文件偏移顺序首尾相接，写到同一个输出文件，产物就是映像本身。
MEMORY {
  # 段 0：映像文件偏移 $1C000 起，553 字节
  SEG0: file = %O, start = $5800, size = $229, fill = yes;
  # 段 1：映像文件偏移 $1C229 起，15831 字节
  SEG1: file = %O, start = $C229, size = $3DD7, fill = yes;
}
SEGMENTS {
  SEG0_0000: load = SEG0, type = ro;
  SEG1_0000: load = SEG1, type = ro;
  SEG1_005E: load = SEG1, type = ro;
  SEG1_01BD: load = SEG1, type = ro;
  SEG1_08CA: load = SEG1, type = ro;
  SEG1_0E7C: load = SEG1, type = ro;
  SEG1_1028: load = SEG1, type = ro;
  SEG1_1FCC: load = SEG1, type = ro;
  SEG1_27D0: load = SEG1, type = ro;
  SEG1_318F: load = SEG1, type = ro;
  SEG1_31EF: load = SEG1, type = ro;
  SEG1_3833: load = SEG1, type = ro;
}
