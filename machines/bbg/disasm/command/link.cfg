# 链接配置：由 FC Dev 的反汇编工程按布局生成，不要手改。
# 各段按映像文件偏移顺序首尾相接，写到同一个输出文件，产物就是映像本身。
MEMORY {
  # 段 0：映像文件偏移 $2 起，15275 字节
  SEG0: file = %O, start = $8000, size = $3BAB, fill = yes;
}
SEGMENTS {
  SEG0_0000: load = SEG0, type = ro;
  SEG0_0874: load = SEG0, type = ro;
  SEG0_1084: load = SEG0, type = ro;
  SEG0_13EF: load = SEG0, type = ro;
  SEG0_1B84: load = SEG0, type = ro;
  SEG0_25D2: load = SEG0, type = ro;
  SEG0_26CF: load = SEG0, type = ro;
  SEG0_2E68: load = SEG0, type = ro;
  SEG0_31BD: load = SEG0, type = ro;
  SEG0_3480: load = SEG0, type = ro;
}
