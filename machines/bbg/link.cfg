# 名称：link.cfg
# 说明：bbg BIOS 的链接配置：每个 org 对应一段，段放在原版 org 指定的地址，段长取到下一个 org 为止。
# 作者：sungbin
# 邮箱：sungbin@3578.cn
# 日期：2026-11-23
MEMORY {
  S0: file = %O, start = $C000, size = $3F00;
  S1: file = %O, start = $FF00, size = $0001;
  S2: file = %O, start = $FF01, size = $0007;
  S3: file = %O, start = $FF08, size = $0001;
  S4: file = %O, start = $FF09, size = $0007;
  S5: file = %O, start = $FF10, size = $0001;
  S6: file = %O, start = $FF11, size = $00E9;
  S7: file = %O, start = $FFFA, size = $0006;
}
SEGMENTS {
  S0: load = S0, type = ro;
  S1: load = S1, type = ro;
  S2: load = S2, type = ro;
  S3: load = S3, type = ro;
  S4: load = S4, type = ro;
  S5: load = S5, type = ro;
  S6: load = S6, type = ro;
  S7: load = S7, type = ro;
}
