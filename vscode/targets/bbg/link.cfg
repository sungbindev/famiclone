# 名称：link.cfg
# 说明：步步高学生电脑 BBGDOS 的 CMD 程序的链接配置：文件前 2 个字节是装入地址（低字节在前），
#       后面是程序内容；DOS 把内容装到这个地址并从这里开始执行，所以启动代码 crt0 的第一条指令放在
#       装入地址上。程序放在 $8000-$BFFF（一个 16K 页），BSS 紧接在程序后面，不写进文件。
#       零页只划出 $0020-$007F，BIOS 与 DOS 的调用是否改写这一段没有核对。
MEMORY {
    ZP:         file = "", start = $0020, size = $0060;
    HEADER:     file = %O, start = $0000, size = $0002;
    PROGRAM:    file = %O, start = $8000, size = $4000, define = yes;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp,  optional = yes;
    LOADADDR:  load = HEADER,   type = ro;
    STARTUP:   load = PROGRAM,  type = ro;
    CODE:      load = PROGRAM,  type = ro;
    RODATA:    load = PROGRAM,  type = ro,  optional = yes;
    DATA:      load = PROGRAM,  type = rw,  optional = yes;
    BSS:       load = PROGRAM,  type = bss, optional = yes;
}
