# 名称：link.cfg
# 说明：中华学习机 CEC-I 的 DOS 3.3 二进制程序（BRUN 运行）的链接配置：程序放在装入地址 LOAD_ADDRESS
#       （默认 $6000，由目标选项 loadAddress 经 ld65 的 -D 传入）到 HIMEM 之间，文件内容就是这一段，
#       文件头（装入地址与长度）由打包器加；装入地址上的第一条指令是启动代码 crt0 的第一条指令，
#       BSS 紧接在程序后面，不写进文件。
#       HIMEM 取汉字方式下的用户程序上限 $9200（英文方式是 $9600）；零页只划出 $001A-$001F，
#       没有核对汉字系统是否改写这一段。
SYMBOLS {
    LOAD_ADDRESS: type = weak, value = $6000;
    HIMEM:        type = weak, value = $9200;
}

MEMORY {
    ZP:      file = "", start = $001A, size = $0006;
    PROGRAM: file = %O, start = LOAD_ADDRESS, size = HIMEM - LOAD_ADDRESS, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp,  optional = yes;
    STARTUP:  load = PROGRAM, type = ro;
    CODE:     load = PROGRAM, type = ro;
    RODATA:   load = PROGRAM, type = ro,  optional = yes;
    DATA:     load = PROGRAM, type = rw,  optional = yes;
    BSS:      load = PROGRAM, type = bss, optional = yes;
}
