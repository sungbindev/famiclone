# 名称：link.cfg
# 说明：整机 ROM 工程的默认链接配置：32K 映像映射在 $8000-$FFFF，空隙填 $FF，中断向量在 $FFFA。
#       各机型的固件布局不同，项目要在 fcdev.json 里用 linkConfig 指向自己的链接配置；这份只是缺省值。
MEMORY {
    ROM: file = %O, start = $8000, size = $8000, fill = yes, fillval = $FF;
}

SEGMENTS {
    CODE:    load = ROM, type = ro;
    RODATA:  load = ROM, type = ro, optional = yes;
    VECTORS: load = ROM, type = ro, start = $FFFA, optional = yes;
}
