# 名称：link.cfg
# 说明：SB97 DOS 程序的链接配置：32K 映像映射在 $8000-$FFFF，偏移 $7FF8 起是签名 AA 55 与三个向量（段 VECTORS，由 crt0 提供）。
#       RAMCODE 段存在映像里、运行在工作 RAM $6000 起的 3K；WRAM 段是工作 RAM 里 $6C00 起的缓冲，不占映像。
#       内部 RAM（$0200-$07FF）里 BIOS 功能占用的单元没有核对，调用 BIOS 功能的程序要自己确认。
MEMORY {
    ZP:         file = "", start = $0000, size = $0100;
    RAM:        file = "", start = $0200, size = $0600;
    WRAM_CODE:  file = "", start = $6000, size = $0C00;
    WRAM_BUF:   file = "", start = $6C00, size = $1400;
    ROM:        file = %O, start = $8000, size = $8000, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,        type = zp,  optional = yes;
    BSS:       load = RAM,       type = bss, optional = yes;
    WRAM:      load = WRAM_BUF,  type = bss, optional = yes;
    CODE:      load = ROM,       type = ro;
    RODATA:    load = ROM,       type = ro,  optional = yes;
    RAMCODE:   load = ROM,       run = WRAM_CODE, type = rw, define = yes, optional = yes;
    VECTORS:   load = ROM,       type = ro,  start = $FFF8;
}
