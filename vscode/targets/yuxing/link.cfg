# 名称：link.cfg
# 说明：裕兴学习机 DOS 程序的链接配置：DOS 把文件原样装进工作 RAM $6000 起，再从 $6000 开始执行，
#       所以程序整体放在 $6000-$7FFF（8K），文件里没有头，也不补齐；启动代码 crt0 的第一条指令必须是 JMP。
#       DATA 段在程序所在的 RAM 里，可以直接读写，不用复制。
#       内部 RAM（$0200-$07FF）里 DOS 与 BIOS 占用的单元没有核对，程序要自己确认。
MEMORY {
    ZP:         file = "", start = $0000, size = $0100;
    RAM:        file = "", start = $0400, size = $0400;
    PROGRAM:    file = %O, start = $6000, size = $2000;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp,  optional = yes;
    BSS:       load = RAM,      type = bss, optional = yes;
    STARTUP:   load = PROGRAM,  type = ro;
    CODE:      load = PROGRAM,  type = ro;
    RODATA:    load = PROGRAM,  type = ro,  optional = yes;
    DATA:      load = PROGRAM,  type = rw,  optional = yes;
}
